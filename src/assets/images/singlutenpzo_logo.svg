    <!-- Left Leaf -->
    <path d="M 480,130 C 460,40 540,5 610,120 C 570,120 500,140 480,130 Z" fill="#00833e" />
    <path d="M 480,130 C 520,70 570,40 610,120" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.4"/>
    
    <!-- Right Leaf -->
    <path d="M 580,150 C 600,60 720,25 760,130 C 700,165 620,165 580,150 Z" fill="#4bae4f" />
    <path d="M 580,150 C 640,100 700,70 760,130" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.4"/>
  </g>

  <!-- Wheat stalk arc on left of arc -->
  <g id="wheat" fill="#f59e0b" stroke="#e67e22" stroke-width="1">
    <path d="M 425,145 C 400,170 380,200 370,240 C 382,235 395,225 410,210 C 415,190 420,165 425,145 Z" />
    <path d="M 405,175 C 380,195 360,225 350,265 C 362,260 375,250 390,235 C 395,215 400,195 405,175 Z" />
