    <!-- Yellow arc -->
    <path d="M 410,250 C 480,150 650,155 830,400 C 815,310 680,170 410,250 Z" fill="#f8b319" />

    <!-- Blue arc with stars -->
    <path d="M 416,260 C 485,165 645,170 820,430 C 808,340 680,185 416,260 Z" fill="#00247d" />

    <!-- Stars on blue arc -->
    <g fill="#ffffff">
      <polygon points="630,215 632,220 637,220 633,223 635,228 630,225 625,228 627,223 623,220 628,220" />
      <polygon points="670,228 672,233 677,233 673,236 675,241 670,238 665,241 667,236 663,233 668,233" />
      <polygon points="705,248 707,253 712,253 708,256 710,261 705,258 700,261 702,256 698,253 703,253" />
      <polygon points="735,275 737,280 742,280 738,283 740,288 735,285 730,288 732,283 728,280 733,280" />
      <polygon points="758,308 760,313 765,313 761,316 763,321 758,318 753,321 755,316 751,313 756,313" />
      <polygon points="775,345 777,350 782,350 778,353 780,358 775,355 770,358 772,353 768,350 773,350" />
      <polygon points="785,385 787,390 792,390 788,393 790,398 785,395 780,398 782,393 778,390 783,390" />
      <polygon points="790,425 792,430 797,430 793,433 795,438 790,435 785,438 787,433 783,430 788,430" />
    </g>

    <!-- Red arc -->
    <path d="M 422,270 C 490,180 640,185 790,480 C 795,430 680,200 422,270 Z" fill="#cf142b" />
  </g>

  <!-- Main Brand Title: Oriven -->
  <text x="0" y="470" font-family="'Fredoka', 'Poppins', 'Segoe UI', sans-serif" font-weight="900" font-size="220" fill="#f27200" letter-spacing="-6">Oriven</text>

  <!-- Subtitle: Distribuidora de Alimentos J-40633400-6 -->
  <text x="200" y="525" font-family="'Caveat', 'Segoe Print', 'Brush Script MT', cursive, sans-serif" font-weight="700" font-size="52" fill="#1e293b">Distribuidora de Alimentos</text>
  <text x="560" y="570" font-family="'Courier New', Courier, monospace" font-weight="800" font-size="34" fill="#0f172a">J-40633400-6</text>
</svg>
